<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Personnages et cache du jeu</title>
<style>
  /* Jetons de src/styles/theme.css (DA de l'appli). */
  :root {
    color-scheme: dark;
    --background: #0a0a0f; --accent: #6366f1; --accent-muted: rgba(99,102,241,.2); --accent-soft: #d5d6ff;
    --glass: rgba(20,20,32,.42); --glass-edge: rgba(255,255,255,.09);
    --ink: rgba(255,255,255,.92); --dim: rgba(255,255,255,.58); --mute: rgba(255,255,255,.38); --line: rgba(255,255,255,.06);
    --success: #34d399; --warning: #fbbf24; --danger: #f87171; --gold: #f0b56b; --info: #60a5fa; --coral: #f0997b; --teal: #5dcaa5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 18% 40%, rgba(99,102,241,.16) 0%, transparent 60%), radial-gradient(ellipse at 85% 10%, rgba(139,92,246,.10) 0%, transparent 50%), var(--background); background-attachment: fixed; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .glass { background: var(--glass); backdrop-filter: blur(34px) saturate(150%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.3); border-radius: 18px; }
  .bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(10,10,15,.94); border-bottom: 1px solid var(--glass-edge); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-edge); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--dim); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .note { flex-basis: 100%; color: var(--mute); font-size: 12px; max-width: 120ch; }
  .page { max-width: 1440px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px; }
  .hubnav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .hubnav .label { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--mute); text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; }
  .tabs span { padding: 6px 14px; border-radius: 999px; font-weight: 600; color: var(--dim); }
  .tabs .on { background: var(--accent); color: #fff; }
  .tabs .new { outline: 2px dashed var(--success); outline-offset: 2px; }
  .eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  .meta { color: var(--dim); font-size: 12px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 11px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight: 600; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.danger { border-color: rgba(248,113,113,.45); color: var(--danger); background: rgba(248,113,113,.08); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 9px; }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid rgba(255,255,255,.14); color: var(--dim); white-space: nowrap; }
  .pill.ok { color: var(--success); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
  .pill.warn { color: var(--warning); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.1); }
  .pill.info { color: var(--info); border-color: rgba(96,165,250,.4); background: rgba(96,165,250,.1); }
  .hidden { display: none !important; }

  /* ── Personnages ── */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .search { min-width: 260px; padding: 9px 12px; border-radius: 11px; border: 1px solid rgba(255,255,255,.12); background: #12121a; outline: none; }
  .layoutA { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .card { overflow: hidden; border-radius: 16px; border: 1px solid var(--glass-edge); background: rgba(20,20,32,.55); display: flex; flex-direction: column; }
  .card:hover { border-color: rgba(99,102,241,.5); }
  .face { position: relative; aspect-ratio: 4 / 5; display: grid; place-items: end start; padding: 10px;
    background: radial-gradient(circle at 50% 38%, color-mix(in oklab, var(--c) 55%, transparent) 0 22%, transparent 23%), radial-gradient(ellipse at 50% 100%, color-mix(in oklab, var(--c) 35%, transparent) 0 42%, transparent 43%), linear-gradient(180deg, #1a1a28, #0d0d14); }
  .face .badge { position: absolute; top: 10px; right: 10px; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .card b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 10px; color: var(--dim); font-size: 11.5px; }
  .rail { padding: 16px; position: sticky; top: 64px; }
  .local { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .local:last-of-type { border-bottom: 0; }
  .avatar { flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; background: linear-gradient(150deg, color-mix(in oklab, var(--c) 55%, transparent), color-mix(in oklab, var(--c) 12%, transparent)); border: 1px solid color-mix(in oklab, var(--c) 50%, transparent); }
  .local .body { flex: 1; min-width: 0; }
  .local b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: var(--dim); }
  .icon.del:hover { color: var(--danger); border-color: rgba(248,113,113,.4); }
  .more { display: flex; justify-content: center; margin-top: 14px; }
  .subtabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; margin-bottom: 14px; }
  .subtabs button { border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; color: var(--dim); font-weight: 600; }
  .subtabs button.on { background: rgba(255,255,255,.1); color: #fff; }
  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .table td { padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .r { text-align: right; }

  /* ── Cache ── */
  .summary { padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .big { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
  .stack { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; margin-top: 14px; background: rgba(255,255,255,.05); }
  .stack i { display: block; height: 100%; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--k); margin-right: 6px; }
  .state { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; font-size: 12.5px; margin-top: 14px; }
  .state.ok { background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.25); color: #a7f3d0; }
  .state.run { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.3); color: #fde68a; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .rows { margin-top: 14px; padding: 6px 18px; }
  .row { display: grid; grid-template-columns: 34px minmax(0, 1fr) 150px 110px auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .kind { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--k) 18%, transparent); color: var(--k); font-weight: 800; }
  .row b { display: block; }
  .sz { font-size: 16px; font-weight: 700; text-align: right; }
  .modal-wrap { margin-top: 18px; display: grid; place-items: center; }
  .modal { width: min(440px, 100%); padding: 18px 20px; }
  .modal h3 { margin: 0 0 8px; font-size: 16px; }
  .modal ul { margin: 8px 0 14px; padding-left: 18px; color: var(--dim); }

  @media (max-width: 1050px) {
    .layoutA { grid-template-columns: 1fr; }
    .rail { position: static; }
    .summary { grid-template-columns: 1fr; }
    .row { grid-template-columns: 34px minmax(0, 1fr) auto; }
    .row .bargap, .row .sz { display: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Page</b>
  <div class="seg" id="pageSeg"><button data-p="chars" aria-pressed="true">Personnages</button><button data-p="cache" aria-pressed="false">Cache du jeu</button></div>
  <span id="varWrap"><b style="margin:0 6px 0 8px">Variante</b><span class="seg" id="varSeg"><button data-v="A" aria-pressed="true">A · Catalogue + mes presets à droite</button><button data-v="B" aria-pressed="false">B · Deux sous-onglets</button></span></span>
  <span class="note" id="noteTxt"></span>
</div>
<main class="page" id="root"></main>
<script>
const CAT = [
  ["Lucyna Kushinada", "Dead-Luck", 961, 187, "#f0997b", true],
  ["John Wick", "anonymousgamer", 897, 173, "#60a5fa", true],
  ["messing with char tool", "jakeslogan", 644, 132, "#5dcaa5"],
  ["everland3769 Woman", "everland.3769", 643, 111, "#f0b56b"],
  ["Tigrica", "Miktor Zvenhellaeh", 627, 447, "#a78bfa"],
  ["The aerodynamic bud", "unmute", 607, 399, "#34d399"],
  ["Ivar Messer", "JadeStarwatcher", 587, 121, "#f87171"],
  ["Ember", "RedsResort", 561, 129, "#fbbf24"],
];
const LOCAL = [["John Wick", "#60a5fa"], ["Lucyna Kushinada", "#f0997b"]];
const hub = (on) => `<nav class="hubnav"><span class="label">Outils</span><div class="tabs glass">${["Traduction", "Overlay", "Personnages", "Cache du jeu"].map((t) => `<span class="${t === on ? "on" : ""} ${["Personnages", "Cache du jeu"].includes(t) ? "new" : ""}">${t}</span>`).join("")}</div></nav>`;
const fmt = (n) => n.toLocaleString("fr-FR");
const card = ([title, author, dl, likes, c, installed]) => `<article class="card"><div class="face" style="--c:${c}">${installed ? `<span class="pill ok badge">✓ Dans le jeu</span>` : ""}</div><div class="body"><div><b>${title}</b><span class="meta">par ${author}</span></div><div class="stats num"><span>↓ ${fmt(dl)}</span><span>♥ ${fmt(likes)}</span></div>${installed ? `<button class="btn sm" disabled>Déjà installé</button>` : `<button class="btn sm primary">↓ Installer dans le jeu</button>`}</div></article>`;
const toolbar = `<div class="tools"><input class="search" placeholder="Rechercher un preset (ex. Wick)…"><div class="seg"><button aria-pressed="true">Populaires</button><button aria-pressed="false">Récents</button></div><button class="btn">↗ Ouvrir le site</button></div>`;
const localRow = ([n, c]) => `<div class="local"><span class="avatar" style="--c:${c}">${n.split(" ").map((w) => w[0]).slice(0, 2).join("")}</span><div class="body"><b>${n}</b><span class="meta">LIVE · ajouté le 13/11</span></div><button class="icon" title="Copier vers les autres versions (PTU…)">⧉</button><button class="icon del" title="Supprimer">✕</button></div>`;

function charsA() {
  return hub("Personnages") + `<div class="head"><div><div class="eyebrow">star-citizen-characters.com</div><h1>Presets de personnage</h1></div>${toolbar}</div>
  <div class="layoutA"><section><div class="grid">${CAT.map(card).join("")}</div><div class="more"><button class="btn">Afficher plus</button></div></section>
  <aside class="glass rail"><div style="display:flex;justify-content:space-between;align-items:baseline"><div class="eyebrow">Dans le jeu</div><span class="meta num">2 presets · LIVE</span></div>
  <div style="margin-top:6px">${LOCAL.map(localRow).join("")}</div>
  <button class="btn" style="width:100%;margin-top:12px;justify-content:center">📁 Ouvrir le dossier</button>
  <p class="meta" style="margin:12px 0 0">En jeu : créateur de personnage › Charger. Un preset installé est copié dans chaque version installée (LIVE, PTU…).</p></aside></div>`;
}
function charsB(sub) {
  return hub("Personnages") + `<div class="head"><div><div class="eyebrow">Personnages</div><h1>Presets de personnage</h1></div>${sub === "cat" ? toolbar : `<button class="btn">📁 Ouvrir le dossier</button>`}</div>
  <div class="subtabs glass"><button data-s="cat" class="${sub === "cat" ? "on" : ""}">Catalogue en ligne</button><button data-s="loc" class="${sub === "loc" ? "on" : ""}">Dans le jeu (2)</button></div>
  ${sub === "cat" ? `<div class="grid">${CAT.map(card).join("")}</div><div class="more"><button class="btn">Afficher plus</button></div>`
    : `<section class="glass" style="padding:6px 8px"><table class="table"><thead><tr><th>Preset</th><th>Version</th><th>Ajouté le</th><th class="r"></th></tr></thead><tbody>${LOCAL.map(([n]) => `<tr><td><b>${n}</b></td><td class="meta">LIVE</td><td class="meta num">13/11/2026</td><td class="r"><button class="btn sm">⧉ Copier vers PTU</button> <button class="btn sm danger">Supprimer</button></td></tr>`).join("")}</tbody></table></section>`}`;
}

function cache() {
  const rows = [
    ["Shaders 4.10.0", "starcitizen_(sc-alpha-4.10.0)", 3135, "var(--warning)", "S", `<span class="pill warn">Ancienne version</span>`, "Plus utilisé par le jeu : suppression sans conséquence."],
    ["Shaders 4.10.2", "starcitizen_(sc-alpha-4.10.2)", 3089, "var(--info)", "S", `<span class="pill info">Version installée</span>`, "Le jeu le recrée : le prochain lancement sera plus long. À vider en cas de bugs graphiques."],
    ["Rapports de plantage", "crashes · 6 fichiers", 312, "var(--coral)", "!", `<span class="pill">Sans risque</span>`, "Fichiers envoyés au support après un crash."],
  ];
  const total = rows.reduce((n, r) => n + r[2], 0);
  return hub("Cache du jeu") + `<div class="head"><div><div class="eyebrow">%LOCALAPPDATA%\\Star Citizen</div><h1>Cache du jeu</h1></div><div class="tools"><button class="btn">📁 Ouvrir le dossier</button><button class="btn">↻ Recalculer</button></div></div>
  <section class="glass summary"><div><div class="eyebrow">Espace occupé</div><div class="big num">${(total / 1024).toFixed(1).replace(".", ",")} Go</div>
    <div class="stack">${rows.map((r) => `<i style="width:${(r[2] / total) * 100}%;background:${r[3]}"></i>`).join("")}</div>
    <div class="legend">${rows.map((r) => `<span style="--k:${r[3]}">${r[0]} · ${fmt(r[2])} Mo</span>`).join("")}</div>
    <div class="state ok"><span class="dot"></span>Star Citizen est fermé : tu peux vider le cache.</div></div>
    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary">Libérer 3,4 Go sans risque</button><button class="btn danger">Tout vider (6,4 Go)</button><span class="meta" style="max-width:240px">« Sans risque » = anciennes versions et rapports de plantage.</span></div></section>
  <section class="glass rows">${rows.map((r) => `<div class="row"><span class="kind" style="--k:${r[3]}">${r[4]}</span><div><b>${r[0]} ${r[5]}</b><span class="meta">${r[6]}</span></div><div class="bargap"><div class="stack" style="margin:0;height:6px"><i style="width:${(r[2] / 3135) * 100}%;background:${r[3]}"></i></div></div><div class="sz num">${fmt(r[2])} Mo</div><button class="btn sm danger">Supprimer</button></div>`).join("")}</section>
  <div class="modal-wrap"><div class="glass modal"><h3>Tout vider ?</h3><span class="meta">Confirmation avant toute suppression (exemple : « Tout vider »)</span><ul><li>Shaders 4.10.0 · 3 135 Mo</li><li>Shaders 4.10.2 · 3 089 Mo (prochain lancement plus long)</li><li>Rapports de plantage · 312 Mo</li></ul><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn">Annuler</button><button class="btn danger">Supprimer 6,4 Go</button></div></div></div>
  <div class="state run" style="max-width:520px">${"<span class=\"dot\"></span>"}Si Star Citizen tourne : « Ferme le jeu pour vider le cache », boutons grisés.</div>`;
}

const NOTES = {
  chars: "Nouvel onglet du hub Outils. Catalogue : vrais presets les plus téléchargés du site (vignettes du site à la place des dessins). Lucyna Kushinada et John Wick sont réellement installés chez toi (LIVE), d'où « Dans le jeu ». Installer = télécharger le .chf dans user/client/0/CustomCharacters de chaque version installée, comme MultiTool.",
  cache: "Nouvel onglet du hub Outils. Tes vraies valeurs : 3 dossiers dans %LOCALAPPDATA%\\Star Citizen. Différence avec MultiTool : l'appli dit ce qui est sans risque (ancienne version, plantages) et bloque si le jeu tourne.",
};
const state = { p: "chars", v: "A", s: "cat" };
function render() {
  document.querySelectorAll("#pageSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === state.p)));
  document.querySelectorAll("#varSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.v)));
  document.getElementById("varWrap").classList.toggle("hidden", state.p !== "chars");
  document.getElementById("noteTxt").textContent = NOTES[state.p];
  document.getElementById("root").innerHTML = state.p === "cache" ? cache() : state.v === "A" ? charsA() : charsB(state.s);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-p],[data-v],[data-s]");
  if (!t) return;
  if (t.dataset.p) state.p = t.dataset.p;
  if (t.dataset.v) state.v = t.dataset.v;
  if (t.dataset.s) state.s = t.dataset.s;
  render();
});
render();
</script>
</body>
</html>
