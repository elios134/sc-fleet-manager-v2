<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reprendre et Réputation</title>
<style>
  /* Jetons de src/styles/theme.css (DA de l'appli). */
  :root {
    color-scheme: dark;
    --background: #0a0a0f; --accent: #6366f1; --accent-muted: rgba(99,102,241,.2); --accent-soft: #d5d6ff;
    --glass: rgba(20,20,32,.42); --glass-edge: rgba(255,255,255,.09); --glass-edge-hi: rgba(255,255,255,.16);
    --ink: rgba(255,255,255,.92); --dim: rgba(255,255,255,.58); --mute: rgba(255,255,255,.38); --line: rgba(255,255,255,.06);
    --success: #34d399; --warning: #fbbf24; --danger: #f87171; --live: #2ee9a5; --gold: #f0b56b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(ellipse at 18% 40%, rgba(99,102,241,.16) 0%, transparent 60%), radial-gradient(ellipse at 85% 10%, rgba(139,92,246,.10) 0%, transparent 50%), var(--background); background-attachment: fixed; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  .glass { background: var(--glass); backdrop-filter: blur(34px) saturate(150%); border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 30px rgba(0,0,0,.3); border-radius: 18px; }

  .bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(10,10,15,.94); border-bottom: 1px solid var(--glass-edge); }
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--glass-edge); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--dim); font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .note { flex-basis: 100%; color: var(--mute); font-size: 12px; max-width: 120ch; }

  .page { max-width: 1440px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px; }
  .hubnav { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .hubnav .label { font-size: 11px; font-weight: 700; letter-spacing: .18em; color: var(--mute); text-transform: uppercase; }
  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 999px; }
  .tabs span { padding: 6px 14px; border-radius: 999px; font-weight: 600; color: var(--dim); }
  .tabs .on { background: var(--accent); color: #fff; }
  .eyebrow { font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); font-weight: 700; }
  .meta { color: var(--dim); font-size: 12px; }
  .eg { color: var(--warning); font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .btn { padding: 8px 14px; border-radius: 11px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); font-weight: 600; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .gain { color: var(--success); font-weight: 700; }
  .hidden { display: none !important; }

  /* Emblème de faction (monogramme) */
  .emblem { flex: none; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; font-weight: 800; font-size: 13px; letter-spacing: .04em;
    background: linear-gradient(150deg, color-mix(in oklab, var(--c) 55%, transparent), color-mix(in oklab, var(--c) 12%, transparent)); border: 1px solid color-mix(in oklab, var(--c) 50%, transparent); color: #fff; }
  .emblem.lg { width: 64px; height: 64px; border-radius: 18px; font-size: 18px; }

  /* Échelle des rangs : segments égaux, segment courant rempli au prorata. */
  .ladder { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .ladder .sg { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .ladder .sg i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #8b8df8); }
  .ladder .sg.full i { width: 100%; background: color-mix(in oklab, var(--accent) 70%, transparent); }
  .ladder .lb { font-size: 10.5px; color: var(--mute); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ladder .lb.cur { color: #fff; font-weight: 700; }
  .ladder .lb.goal { color: var(--gold); font-weight: 700; }

  /* ── Réputation A : liste + fiche ── */
  .layoutA { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; align-items: start; }
  .flist { padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .fitem { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid transparent; background: transparent; }
  .fitem:hover { background: rgba(255,255,255,.04); }
  .fitem.on { background: var(--accent-muted); border-color: rgba(99,102,241,.45); }
  .fitem .body { min-width: 0; flex: 1; }
  .fitem b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini { height: 4px; border-radius: 999px; background: rgba(255,255,255,.08); margin-top: 7px; overflow: hidden; }
  .mini i { display: block; height: 100%; background: var(--accent); }
  .hero { padding: 22px 24px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; }
  .hero h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; text-wrap: balance; }
  .rankname { font-size: 15px; color: var(--accent-soft); font-weight: 600; margin-top: 2px; }
  .ring { position: relative; width: 112px; height: 112px; }
  .ring svg { transform: rotate(-90deg); }
  .ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .ring .c b { display: block; font-size: 22px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; margin-top: 18px; }
  .kpis div { background: rgba(15,15,24,.85); padding: 12px 14px; }
  .kpis b { display: block; font-size: 19px; margin-top: 2px; }
  .panel { padding: 18px 20px; margin-top: 14px; }
  .ptabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .ptabs button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; color: var(--dim); font-weight: 600; }
  .ptabs button.on { background: rgba(255,255,255,.08); color: #fff; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  .r { text-align: right; }
  .tw { overflow-x: auto; }
  .rate { display: inline-flex; align-items: center; gap: 8px; }
  .rate i { display: inline-block; height: 5px; border-radius: 999px; background: var(--live); opacity: .8; }
  .deduce { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px dashed rgba(255,255,255,.12); margin-top: 16px; font-size: 12px; color: var(--dim); }
  .deduce .btn { padding: 5px 10px; font-size: 12px; margin-left: auto; white-space: nowrap; }

  /* ── Réputation B : tableau des factions ── */
  .rows { display: flex; flex-direction: column; gap: 10px; }
  .frow { display: grid; grid-template-columns: 260px minmax(0, 1fr) 150px; gap: 22px; align-items: center; padding: 16px 20px; }
  .frow.on { border-color: rgba(99,102,241,.5); }
  .frow .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .frow .who b { display: block; }
  .frow .right { text-align: right; }
  .frow .right b { display: block; font-size: 18px; }
  .expand { padding: 4px 20px 18px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }

  /* ── Reprendre ── */
  .where { padding: 26px 28px; display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap;
    background: linear-gradient(120deg, rgba(99,102,241,.22), rgba(20,20,32,.42) 55%); }
  .where h1 { margin: 4px 0 2px; font-size: 32px; letter-spacing: -.02em; }
  .resume { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .card { padding: 18px 20px; }
  .card h3 { margin: 0 0 12px; }
  .item { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .places { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .place { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--glass-edge); text-align: left; }
  .place b { display: block; font-size: 18px; }
  .tl { position: relative; padding-left: 22px; }
  .tl::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.08); }
  .ev { position: relative; padding: 0 0 16px; }
  .ev:last-child { padding-bottom: 0; }
  .ev::before { content: ""; position: absolute; left: -21px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--d, var(--accent)); box-shadow: 0 0 0 3px rgba(10,10,15,1); }
  .ev .t { font-size: 11px; color: var(--mute); }
  .aim { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--glass-edge); margin-top: 8px; }
  .aim .body { flex: 1; min-width: 0; }

  @media (max-width: 1050px) {
    .layoutA, .resume, .expand { grid-template-columns: 1fr; }
    .hero { grid-template-columns: auto minmax(0, 1fr); }
    .hero .ring { grid-column: 1 / -1; justify-self: start; }
    .frow { grid-template-columns: 1fr; }
    .frow .right { text-align: left; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .places { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="bar">
  <b>Page</b>
  <div class="seg" id="pageSeg"><button data-p="rep" aria-pressed="true">Réputation</button><button data-p="resume" aria-pressed="false">Reprendre ma partie</button></div>
  <span id="varWrap"><b style="margin:0 6px 0 8px">Variante</b><span class="seg" id="varSeg"><button data-v="A" aria-pressed="true">A · Liste + fiche</button><button data-v="B" aria-pressed="false">B · Tableau des factions</button></span></span>
  <span class="note" id="noteTxt"></span>
</div>
<main class="page" id="root"></main>
<script>
const EG = `<span class="eg">exemple</span>`;
const RANKS = ["Neutral", "Jr. Contractor", "Contractor", "Sr. Contractor", "Veteran Contractor", "Head Contractor", "Elite Contractor"];
const FACTIONS = [
  { id: "isec", name: "InterSec Defense Solutions", mono: "IS", c: "#60a5fa", rank: 4, inRank: 300, span: 23000, gained: 300, missions: 1, real: true },
  { id: "cov", name: "Covalex", mono: "CX", c: "#f0b56b", rank: 2, inRank: 1500, span: 3600, gained: 1500, missions: 6 },
  { id: "bhg", name: "Bounty Hunters Guild", mono: "BH", c: "#f87171", rank: 1, inRank: 450, span: 1400, gained: 450, missions: 3 },
];
const JOURNAL = [["14/11 · 23:58", "Neutralisez la menace Vanduul et Shattered Blade", 300, "Brassards + Jambières Palatino Raider Camo"]];
const ADVICE = [["Engagez Shattered Blade et les Vanduul", 300, 20], ["Contre-attaque contre les raiders Vanduul", 300, 36], ["Neutralisez la menace Vanduul et Shattered Blade", 300, 36], ["Patrouillez le terrain de chasse Vanduul", 300, 39], ["Gérez l'attaque Vanduul sur le vaisseau", 300, 40]];
const hub = (l, tabs, on) => `<nav class="hubnav"><span class="label">${l}</span><div class="tabs glass">${tabs.map((t) => `<span class="${t === on ? "on" : ""}">${t}</span>`).join("")}</div></nav>`;
const fmt = (n) => n.toLocaleString("fr-FR");
const pct = (f) => Math.round((f.inRank / f.span) * 100);
const ladder = (f, goal) => `<div class="ladder">${RANKS.map((_, i) => `<div class="sg ${i < f.rank ? "full" : ""}"><i style="width:${i === f.rank ? Math.max(pct(f), 3) : i < f.rank ? 100 : 0}%"></i></div>`).join("")}${RANKS.map((r, i) => `<div class="lb ${i === f.rank ? "cur" : i === goal ? "goal" : ""}">${r.replace(" Contractor", "")}</div>`).join("")}</div>`;
const ring = (p) => { const r = 48, c = 2 * Math.PI * r; return `<div class="ring"><svg width="112" height="112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * Math.max(p, 2)) / 100} ${c}"/></svg><div class="c"><div><b class="num">${p}%</b><span class="meta">vers le rang suivant</span></div></div></div>`; };
const journalTable = () => `<div class="tw"><table><thead><tr><th>Quand</th><th>Mission</th><th class="r">Réputation</th><th>Butin</th></tr></thead><tbody>${JOURNAL.map(([d, m, r, l]) => `<tr><td class="meta num">${d}</td><td><b style="font-weight:600">${m}</b></td><td class="r num gain">+${r}</td><td class="meta">${l}</td></tr>`).join("")}</tbody></table></div>`;
const adviceTable = () => { const max = Math.max(...ADVICE.map(([, r, m]) => r * 60 / m)); return `<div class="tw"><table><thead><tr><th>Mission</th><th class="r">Rép.</th><th class="r">Durée</th><th>Rép. par heure</th></tr></thead><tbody>${ADVICE.map(([t, r, m]) => { const h = Math.round(r * 60 / m); return `<tr><td><b style="font-weight:600">${t}</b></td><td class="r num">+${r}</td><td class="r meta num">${m} min</td><td><span class="rate"><i style="width:${Math.round((h / max) * 90)}px"></i><span class="num">${fmt(h)}</span></span></td></tr>`; }).join("")}</tbody></table></div>`; };

function repA(sel) {
  const f = FACTIONS.find((x) => x.id === sel);
  const left = f.span - f.inRank;
  return `<div class="layoutA">
    <aside class="glass flist"><div class="eyebrow" style="padding:6px 8px 4px">Mes factions</div>
      ${FACTIONS.map((x) => `<button class="fitem ${x.id === sel ? "on" : ""}" data-f="${x.id}"><span class="emblem" style="--c:${x.c}">${x.mono}</span><span class="body"><b>${x.name}${x.real ? "" : EG}</b><span class="meta">${RANKS[x.rank]}</span><div class="mini"><i style="width:${Math.max(pct(x), 3)}%"></i></div></span><span class="gain num">+${fmt(x.gained)}</span></button>`).join("")}
      <p class="meta" style="margin:8px 8px 4px">Une faction s'ajoute à ta première mission terminée chez elle.</p>
    </aside>
    <section>
      <div class="glass" style="padding-bottom:20px">
        <div class="hero"><span class="emblem lg" style="--c:${f.c}">${f.mono}</span><div><div class="eyebrow">Faction</div><h1>${f.name}${f.real ? "" : EG}</h1><div class="rankname">${RANKS[f.rank]}${f.real ? " · au moins" : ""}</div></div>${ring(pct(f))}</div>
        <div style="padding:0 24px">${ladder(f, f.rank + 1)}
          <div class="kpis"><div><span class="eyebrow">Gagné depuis le suivi</span><b class="num gain">+${fmt(f.gained)}</b></div><div><span class="eyebrow">Missions terminées</span><b class="num">${f.missions}</b></div><div><span class="eyebrow">Avant ${RANKS[f.rank + 1]}</span><b class="num">${fmt(left)}</b></div><div><span class="eyebrow">Missions restantes</span><b class="num">≈ ${Math.ceil(left / 300)}</b></div></div>
          ${f.real ? `<div class="deduce"><span>Rang déduit : le 14/11 tu as accepté une mission qui exige <b style="color:#fff">Veteran Contractor</b>. Le jeu n'écrit pas ton total exact.</span><button class="btn">Corriger mon rang</button></div>` : ""}
        </div>
      </div>
      <div class="glass panel"><div class="ptabs"><button class="on">Missions conseillées</button><button>Journal (${JOURNAL.length})</button></div>${adviceTable()}<p class="meta" style="margin:10px 0 0">Missions de ton rang, triées par réputation à l'heure. Durées indicatives du wiki.</p></div>
    </section>
  </div>`;
}

function repB(sel) {
  return `<div class="rows">${FACTIONS.map((f) => `<div class="glass ${f.id === sel ? "frow on" : "frow"}" data-f="${f.id}" style="cursor:pointer">
      <div class="who"><span class="emblem" style="--c:${f.c}">${f.mono}</span><div style="min-width:0"><b>${f.name}${f.real ? "" : EG}</b><span class="meta">${f.missions} mission${f.missions > 1 ? "s" : ""} · <span class="gain">+${fmt(f.gained)}</span></span></div></div>
      ${ladder(f, f.rank + 1)}
      <div class="right"><span class="eyebrow">Avant ${RANKS[f.rank + 1]}</span><b class="num">${fmt(f.span - f.inRank)}</b><span class="meta">≈ ${Math.ceil((f.span - f.inRank) / 300)} missions</span></div>
    </div>${f.id === sel ? `<div class="glass expand" style="margin-top:-6px"><div><div class="eyebrow" style="margin:14px 0 8px">Missions conseillées</div>${adviceTable()}</div><div><div class="eyebrow" style="margin:14px 0 8px">Journal</div>${journalTable()}<div class="deduce"><span>Rang déduit d'une mission acceptée le 14/11 (exige Veteran Contractor).</span><button class="btn">Corriger</button></div></div></div>` : ""}`).join("")}</div>`;
}

function resume() {
  const items = [["Cruz Lux", 26], ["Volt Parallax · chargeur", 20], ["Behring sniper · chargeur", 13], ["Stylo de soin", 6], ["Fiole de MedGun", 2]];
  const f = FACTIONS[0];
  return hub("Inventaire", ["Inventaire", "Reprendre ma partie"], "Reprendre ma partie") + `
  <section class="glass where"><div><div class="eyebrow">Où j'en étais · elios5</div><h1>Moraine Base</h1><span class="meta">Nyx · dernière session ven. 14 nov., 1 h 13</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary">Voir sur la carte</button><button class="btn">+ Itinéraire</button></div></section>
  <div class="resume">
    <div>
      <section class="glass card"><h3 class="eyebrow">Dernière session</h3><div class="tl">
        <div class="ev" style="--d:var(--success)"><div class="t">23:58</div><b>Mission terminée · Neutralisez la menace Vanduul et Shattered Blade</b><div class="meta">InterSec · <span class="gain">+300 rép.</span> · 2 plans de fabrication reçus</div></div>
        <div class="ev"><div class="t">23:45</div><b>Mission acceptée</b><div class="meta">Rejoindre Moraine Base</div></div>
        <div class="ev" style="--d:var(--warning)"><div class="t">23:40 ${EG}</div><b>Vaisseau · Perseus</b><div class="meta">Sorti à Nyx Castra</div></div>
        <div class="ev" style="--d:var(--mute)"><div class="t">22:45</div><b>Connexion</b><div class="meta">Pyro, puis Nyx</div></div>
      </div></section>
      <section class="glass card" style="margin-top:16px"><h3 class="eyebrow">Ce que je visais</h3>
        <div class="aim"><span class="emblem" style="--c:${f.c}">${f.mono}</span><div class="body"><div style="display:flex;justify-content:space-between;gap:8px"><b>InterSec → ${RANKS[f.rank + 1]}</b><span class="meta num">encore ${fmt(f.span - f.inRank)}</span></div><div class="mini"><i style="width:3%"></i></div></div></div>
        <div class="aim"><span class="emblem" style="--c:#c2773f">PL</span><div class="body"><div style="display:flex;justify-content:space-between;gap:8px"><b>Armure Palatino Raider ${EG}</b><span class="meta">2 matériaux manquants</span></div><div class="mini"><i style="width:60%;background:var(--gold)"></i></div></div></div>
      </section>
    </div>
    <div>
      <section class="glass card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3 class="eyebrow" style="margin:0">Sur moi</h3><span class="meta num">7 objets · 69 unités</span></div><div style="margin-top:10px">${items.map(([n, q]) => `<div class="item"><span>${n}</span><b class="num">×${q}</b></div>`).join("")}</div><button class="btn" style="margin-top:12px;width:100%">Tout voir dans l'Inventaire</button></section>
      <section class="glass card" style="margin-top:16px"><h3 class="eyebrow">Laissé ailleurs</h3><div class="places">${[["Orison", 12], ["Lorville", 31], ["Port Tressler", 4]].map(([n, q]) => `<button class="place"><b class="num">${q}</b><span class="meta">objets · ${n}</span></button>`).join("")}</div></section>
    </div>
  </div>`;
}

const NOTES = {
  rep: "Nouvel onglet du hub Missions. Les points s'ajoutent seuls à chaque mission terminée (contrat lu dans le Game.log, réputation du wiki). InterSec : ta vraie mission du 14/11, vrais rangs et vraies missions du wiki. « exemple » = factions inventées pour montrer la liste. Clique une faction pour changer la fiche.",
  resume: "Page ouverte avant de lancer le jeu. Lieu, session, mission, objets : tes vraies données (14/11). « exemple » = blocs sans donnée dans ta base pour l'instant.",
};
const state = { p: "rep", v: "A", f: "isec" };
function render() {
  document.querySelectorAll("#pageSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.p === state.p)));
  document.querySelectorAll("#varSeg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === state.v)));
  document.getElementById("varWrap").classList.toggle("hidden", state.p !== "rep");
  document.getElementById("noteTxt").textContent = NOTES[state.p];
  document.getElementById("root").innerHTML = state.p === "resume" ? resume() : hub("Missions", ["Hub", "Réputation"], "Réputation") + (state.v === "A" ? repA(state.f) : repB(state.f));
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-p],[data-v],[data-f]");
  if (!t) return;
  if (t.dataset.p) state.p = t.dataset.p;
  if (t.dataset.v) state.v = t.dataset.v;
